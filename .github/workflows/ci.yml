name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # ==========================================
  # TRILHA BACKEND
  # ==========================================
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar dependências e Flake8
        run: |
          pip install flake8
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Executar Lint (Flake8)
        run: flake8 backend/

  build-backend:
    needs: lint-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validação do Container Backend
        run: docker build -t backend-test ./backend

  test-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar dependências
        run: |
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Executar Testes (Django)
        run: |
          cd backend
          python manage.py test

  # ==========================================
  # TRILHA FRONTEND
  # ==========================================
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Instalar dependências
        run: cd frontend && npm install
      - name: Executar Lint (ESLint)
        run: cd frontend && npm run lint || echo "Lint script não configurado, a ignorar por agora..."

  build-frontend:
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Instalar dependências
        run: cd frontend && npm install
      - name: Executar Build
        run: cd frontend && npm run build

  test-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Instalar dependências
        run: cd frontend && npm install
      - name: Executar Testes
        run: cd frontend && npm test || echo "Sem testes definidos, a ignorar por agora..."

# ==========================================
  # DEPLOY CONTÍNUO (GHCR)
  # ==========================================
  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Autenticação no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e Push do Backend
        run: |
          # Converte o nome do repositório para minúsculas (exigência do Docker)
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$REPO-backend
          
          docker build -f backend/Dockerfile.prod -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./backend
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

  deploy-frontend:
    needs: test-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Autenticação no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e Push do Frontend
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$REPO-frontend
          
          docker build -f frontend/Dockerfile.prod -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./frontend
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}